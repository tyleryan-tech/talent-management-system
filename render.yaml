services:
  - type: web
    name: talent-hub-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /opt/render/project/src/data/talent-hub.db
      - key: CORS_ORIGIN
        value: "*"
      - key: NODE_ENV
        value: production
