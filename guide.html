<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人才管理系统 — 操作引导</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f8fafc;--card:#fff;--accent:#2563eb;--accent2:#7c3aed;--accent3:#059669;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
/* === Top bar === */
.topbar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;gap:1rem;height:56px;box-shadow:var(--shadow)}
.topbar h1{font-size:1.1rem;white-space:nowrap}
.role-tabs{display:flex;gap:4px;margin-left:1.5rem}
.role-tab{padding:6px 18px;border:none;border-radius:20px;cursor:pointer;font-size:.85rem;font-weight:600;transition:.2s;background:#f1f5f9;color:var(--muted)}
.role-tab.active{color:#fff}
.role-tab[data-role="hrbp"].active{background:var(--accent)}
.role-tab[data-role="manager"].active{background:var(--accent2)}
.role-tab[data-role="plowner"].active{background:var(--accent3)}
.auto-ctrl{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.auto-ctrl button{padding:4px 12px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font-size:.8rem;transition:.15s}
.auto-ctrl button:hover{background:#f1f5f9}
.auto-ctrl button.playing{background:var(--accent);color:#fff;border-color:var(--accent)}
.speed-sel{padding:3px 6px;border:1px solid var(--border);border-radius:4px;font-size:.8rem}
/* === Layout === */
.app{display:flex;height:calc(100vh - 56px)}
/* === Sidebar / TOC === */
.sidebar{width:260px;min-width:260px;background:#fff;border-right:1px solid var(--border);overflow-y:auto;padding:1rem 0}
.toc-group{margin-bottom:.5rem}
.toc-group-title{padding:4px 1.25rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.toc-item{display:flex;align-items:center;gap:8px;padding:7px 1.25rem;cursor:pointer;font-size:.84rem;transition:.15s;border-left:3px solid transparent;color:var(--text)}
.toc-item:hover{background:#f8fafc}
.toc-item.active{border-left-color:var(--accent);background:#eff6ff;font-weight:600;color:var(--accent)}
.toc-item .toc-num{width:22px;height:22px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:var(--muted);flex-shrink:0}
.toc-item.done .toc-num{background:#dcfce7;color:#16a34a}
.toc-item.active .toc-num{background:var(--accent);color:#fff}
.toc-dur{margin-left:auto;font-size:.7rem;color:var(--muted)}
/* === Main content === */
.main{flex:1;overflow-y:auto;padding:2rem 2.5rem}
.step-card{max-width:820px;margin:0 auto;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.step-hd{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem}
.step-badge{padding:3px 10px;border-radius:12px;font-size:.72rem;font-weight:700;color:#fff}
.step-badge.hrbp{background:var(--accent)}
.step-badge.manager{background:var(--accent2)}
.step-badge.plowner{background:var(--accent3)}
.step-title{font-size:1.4rem;font-weight:700}
.step-time{font-size:.78rem;color:var(--muted);margin-left:auto}
/* Mockup */
.mockup{background:#f8fafc;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:1.5rem}
.mockup-bar{height:32px;background:#e2e8f0;display:flex;align-items:center;padding:0 12px;gap:6px}
.mockup-dot{width:10px;height:10px;border-radius:50%}
.mockup-body{padding:1.25rem;min-height:200px;position:relative}
.mock-nav{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.mock-nav-item{padding:5px 14px;border-radius:6px;font-size:.78rem;background:#e2e8f0;color:var(--muted)}
.mock-nav-item.hl{background:var(--accent);color:#fff;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.4)}50%{box-shadow:0 0 0 8px rgba(37,99,235,0)}}
.mock-table{width:100%;border-collapse:collapse;font-size:.78rem}
.mock-table th{background:#f1f5f9;padding:6px 10px;text-align:left;font-weight:600;border-bottom:1px solid var(--border)}
.mock-table td{padding:6px 10px;border-bottom:1px solid #f1f5f9}
.mock-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 14px;border-radius:6px;font-size:.76rem;font-weight:600;color:#fff;background:var(--accent)}
.mock-btn.green{background:#16a34a}
.mock-btn.orange{background:#d97706}
.mock-btn.red{background:#dc2626}
.mock-btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.mock-btn.hl{animation:pulse 1.5s infinite}
.mock-stat{display:inline-block;padding:8px 18px;background:#eff6ff;border-radius:8px;text-align:center;margin:4px}
.mock-stat .n{font-size:1.4rem;font-weight:700;color:var(--accent)}
.mock-stat .l{font-size:.72rem;color:var(--muted)}
.mock-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;text-align:center;font-size:.72rem}
.mock-grid .cell{padding:14px 6px;border-radius:6px;background:#f1f5f9;transition:.2s}
.mock-grid .cell.hl{background:#dbeafe;border:2px solid var(--accent);animation:pulse 1.5s infinite}
.hotspot{position:absolute;border:2px dashed var(--accent);border-radius:8px;background:rgba(37,99,235,.06);animation:pulse 1.5s infinite;pointer-events:none}
.arrow{position:absolute;color:var(--accent);font-size:1.5rem;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
/* Steps list */
.steps-list{counter-reset:step}
.step-item{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid #f1f5f9;animation:fadeUp .3s ease}
.step-item:last-child{border-bottom:none}
.step-icon{width:32px;height:32px;border-radius:50%;background:#eff6ff;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent);font-size:.85rem}
.step-item .step-text{flex:1}
.step-text strong{color:var(--accent)}
.step-text .op{display:inline-block;padding:1px 8px;border-radius:4px;font-size:.72rem;font-weight:600;margin:0 2px}
.op.click{background:#dbeafe;color:#1d4ed8}
.op.input{background:#fef3c7;color:#92400e}
.op.check{background:#dcfce7;color:#166534}
.op.wait{background:#f1f5f9;color:#64748b}
.tip-box{margin-top:1rem;padding:12px 16px;border-radius:8px;background:#fffbeb;border:1px solid #fde68a;font-size:.82rem;color:#92400e}
.tip-box i{margin-right:6px}
/* Nav buttons */
.step-nav{display:flex;justify-content:space-between;margin-top:2rem;padding-top:1rem;border-top:1px solid var(--border)}
.nav-btn{padding:8px 20px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:.85rem;transition:.15s;display:flex;align-items:center;gap:6px}
.nav-btn:hover{background:#f8fafc}
.nav-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.nav-btn:disabled{opacity:.4;cursor:default}
/* Progress */
.progress-wrap{position:fixed;bottom:0;left:0;right:0;height:4px;background:#e2e8f0;z-index:99}
.progress-bar{height:100%;background:var(--accent);transition:width .3s}
/* Responsive */
@media(max-width:768px){.sidebar{display:none}.main{padding:1rem}.topbar{padding:0 .75rem;gap:.5rem}.role-tabs{margin-left:.5rem}.auto-ctrl{gap:4px}}
</style>
</head>
<body>

<div class="topbar">
  <h1><i class="fa-solid fa-graduation-cap"></i> 操作引导</h1>
  <div class="role-tabs">
    <button class="role-tab active" data-role="hrbp" onclick="switchRole('hrbp')">HRBP 管理员</button>
    <button class="role-tab" data-role="manager" onclick="switchRole('manager')">汇报经理</button>
    <button class="role-tab" data-role="plowner" onclick="switchRole('plowner')">产品线负责人</button>
  </div>
  <div class="auto-ctrl">
    <button id="playBtn" onclick="togglePlay()"><i class="fa-solid fa-play"></i> 自动播放</button>
    <select class="speed-sel" id="speedSel" onchange="setSpeed(this.value)">
      <option value="8000">慢速 8s</option>
      <option value="5000" selected>中速 5s</option>
      <option value="3000">快速 3s</option>
    </select>
  </div>
</div>

<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>
<div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

// ═══════════════════════════════════════════════════════
//  APP STATE & RENDERING
// ═══════════════════════════════════════════════════════
let currentRole = 'hrbp';
let currentStep = 0;
let isPlaying = false;
let playTimer = null;
let speed = 5000;

function allSteps(role){ const r = ROLES[role]; let s=[]; r.chapters.forEach(ch=>ch.steps.forEach(st=>s.push({...st, chapter:ch.title, chapterIcon:ch.icon}))); return s; }

function switchRole(role){
  currentRole = role;
  currentStep = 0;
  document.querySelectorAll('.role-tab').forEach(t=>t.classList.toggle('active',t.dataset.role===role));
  document.documentElement.style.setProperty('--accent', ROLES[role].color);
  render();
}

function goStep(i){
  const steps = allSteps(currentRole);
  if(i<0||i>=steps.length) return;
  currentStep = i;
  render();
}

function render(){
  const role = ROLES[currentRole];
  const steps = allSteps(currentRole);
  const s = steps[currentStep];
  // Sidebar
  let tocHtml = '';
  let idx = 0;
  role.chapters.forEach(ch=>{
    tocHtml += `<div class="toc-group"><div class="toc-group-title"><i class="fa-solid ${ch.icon}"></i> ${ch.title}</div>`;
    ch.steps.forEach(st=>{
      const cls = idx===currentStep?'active':idx<currentStep?'done':'';
      const numContent = idx < currentStep ? '<i class="fa-solid fa-check"></i>' : (idx+1);
      tocHtml += '<div class="toc-item ' + cls + '" onclick="goStep(' + idx + ')"><span class="toc-num">' + numContent + '</span><span>' + st.title + '</span><span class="toc-dur">' + st.time + '</span></div>';
      idx++;
    });
    tocHtml += '</div>';
  });
  document.getElementById('sidebar').innerHTML = tocHtml;
  // Main
  let html = `<div class="step-card"><div class="step-hd"><span class="step-badge ${currentRole}">${role.label}</span><span class="step-title">${s.title}</span><span class="step-time"><i class="fa-regular fa-clock"></i> ${s.time}</span></div>`;
  html += `<div class="mockup">${renderMockup(s.mockup, currentRole)}</div>`;
  html += '<div class="steps-list">';
  s.instructions.forEach((inst,i)=>{
    html += `<div class="step-item" style="animation-delay:${i*0.08}s"><div class="step-icon"><i class="fa-solid ${inst.icon}"></i></div><div class="step-text">${inst.text}</div></div>`;
  });
  html += '</div>';
  if(s.tip) html += `<div class="tip-box"><i class="fa-solid fa-lightbulb"></i>${s.tip}</div>`;
  html += `<div class="step-nav"><button class="nav-btn" onclick="goStep(${currentStep-1})" ${currentStep===0?'disabled':''}><i class="fa-solid fa-chevron-left"></i> 上一步</button><span style="font-size:.82rem;color:var(--muted)">${currentStep+1} / ${steps.length}</span><button class="nav-btn primary" onclick="goStep(${currentStep+1})" ${currentStep===steps.length-1?'disabled':''}>${currentStep===steps.length-1?'已完成':'下一步'} <i class="fa-solid fa-chevron-right"></i></button></div>`;
  html += '</div>';
  document.getElementById('main').innerHTML = html;
  document.getElementById('main').scrollTop = 0;
  // Progress
  const pct = ((currentStep+1)/steps.length*100).toFixed(1);
  document.getElementById('progressBar').style.width = pct+'%';
  // Active TOC scroll
  const active = document.querySelector('.toc-item.active');
  if(active) active.scrollIntoView({block:'center',behavior:'smooth'});
}

function togglePlay(){
  isPlaying = !isPlaying;
  const btn = document.getElementById('playBtn');
  btn.classList.toggle('playing', isPlaying);
  btn.innerHTML = isPlaying ? '<i class="fa-solid fa-pause"></i> 暂停' : '<i class="fa-solid fa-play"></i> 自动播放';
  if(isPlaying) scheduleNext(); else clearTimeout(playTimer);
}

function scheduleNext(){
  if(!isPlaying) return;
  playTimer = setTimeout(()=>{
    const steps = allSteps(currentRole);
    if(currentStep < steps.length-1){ goStep(currentStep+1); scheduleNext(); }
    else{ isPlaying=false; document.getElementById('playBtn').classList.remove('playing'); document.getElementById('playBtn').innerHTML='<i class="fa-solid fa-play"></i> 自动播放'; }
  }, speed);
}

function setSpeed(v){ speed=Number(v); if(isPlaying){clearTimeout(playTimer); scheduleNext();} }

// Keyboard navigation
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();goStep(currentStep+1);}
  if(e.key==='ArrowLeft'){e.preventDefault();goStep(currentStep-1);}
});

// Init
render();
</script>
